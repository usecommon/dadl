name: Release

# Publishes the Python package to PyPI with Trusted Publishing (OIDC): no PyPI
# token is stored anywhere. Triggered by pushing a tag like v0.0.3 that points
# at a commit on main.
#
# The build job has no OIDC permission; only the publish job can mint a PyPI
# token, and it runs nothing but the pinned publish action. Protect the
# `pypi` environment with a required reviewer (see docs/reviews/2026-11-council.md).
#
# One-time setup on pypi.org (Account settings -> Publishing): project
# "dadl-quantum", owner "usecommon", repository "dadl", workflow
# "release.yml", environment "pypi".
#
# The Rust crate is still published by hand (`cargo publish -p dadl`); the
# tag check below at least pins its version to the tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Check versions, provenance of the tag, and tests
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2, pinned by commit SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      # actions/setup-python v5.3.0, pinned by commit SHA
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - name: Tag must match the Python and Rust versions
        run: |
          py=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' python/dadl/__init__.py)
          rs=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v${py}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != python ${py}"; exit 1; }
          test "v${rs}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != rust ${rs}"; exit 1; }
      - name: Tagged commit must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Test
        run: |
          python -m pip install -e "./python[test]"
          python -m pytest python/tests -q

  build:
    name: Build sdist and wheel (no publishing permission)
    needs: check
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2, pinned by commit SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-python v5.3.0, pinned by commit SHA
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build==1.2.2.post1
          python -m build python --outdir dist
      # actions/upload-artifact v4.6.2, pinned by commit SHA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # actions/download-artifact v4.3.0, pinned by commit SHA
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist/
      # pypa/gh-action-pypi-publish v1.14.3, pinned by commit SHA (PEP 740 attestations on by default)
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
