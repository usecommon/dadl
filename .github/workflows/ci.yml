name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      # actions/checkout v4.2.2, pinned by commit SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Test (unit, shared vectors, doctests)
        run: cargo test --workspace --all-targets --locked && cargo test --workspace --doc --locked
      - name: Test in release (input checks must hold in every profile)
        run: cargo test --workspace --release --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    name: Rust core builds on the MSRV (1.74)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2, pinned by commit SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.74 --profile minimal
      - run: cargo +1.74 check -p dadl --lib --locked

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      # actions/checkout v4.2.2, pinned by commit SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-python v5.3.0, pinned by commit SHA
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e "./python[test]"
      - name: Test (guardrail regressions, shared vectors, closed forms, pull study)
        run: python -m pytest python/tests -q
      - name: Quickstart smoke test
        run: dadl quickstart chsh-spad

  python-minimum:
    name: Python 3.10 with the minimum declared dependencies
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2, pinned by commit SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-python v5.3.0, pinned by commit SHA
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.10"
      - name: Install the floors from pyproject.toml
        run: python -m pip install "numpy==1.24.*" "scipy==1.13.*" "pyyaml==6.0.*" -e "./python[test]"
      - name: Test
        run: python -m pytest python/tests -q

  bindings:
    name: Python bindings, Rust backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      # actions/checkout v4.2.2, pinned by commit SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-python v5.3.0, pinned by commit SHA
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.10"
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Clippy (bindings)
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path bindings/python/Cargo.toml --locked -- -D warnings
      - name: Build and install dadl-quantum-core with dadl-quantum
        run: python -m pip install ./bindings/python "./python[test]"
      - name: Every test, with the compiled core required (shared vectors run on both backends)
        env:
          DADL_BACKEND: rust
        run: |
          python -c "import dadl; assert dadl.backend() == 'rust'"
          python -m pytest python/tests -q
      - name: Throughput (recorded, not gated)
        run: python bindings/python/bench.py 1000000

  core-wheels:
    # The same builds as the release workflow, without publishing, so the
    # release path is tested on every pull request rather than first on a tag.
    name: Build dadl-quantum-core wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64, manylinux: "2014"}
          - {os: ubuntu-latest, target: aarch64, manylinux: "2014"}
          - {os: macos-latest, target: universal2-apple-darwin, manylinux: "off"}
          - {os: windows-latest, target: x64, manylinux: "off"}
    steps:
      # actions/checkout v4.2.2, pinned by commit SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-python v5.3.0, pinned by commit SHA
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      # PyO3/maturin-action v1.51.0, pinned by commit SHA
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out ../../dist
      - name: The wheel installs and agrees with the reference (native targets)
        if: matrix.target != 'aarch64'
        shell: bash
        run: |
          python -m pip install dist/*.whl "./python[test]"
          DADL_BACKEND=rust python -m pytest python/tests/test_vectors.py python/tests/test_backend.py -q

  package:
    name: Build sdist and wheel, test the installed package
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2, pinned by commit SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-python v5.3.0, pinned by commit SHA
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - name: Build
        run: python -m pip install build==1.2.2.post1 && python -m build python --outdir dist
      - name: Licences are in both artifacts
        run: |
          tar tzf dist/*.tar.gz | grep -q LICENSE-APACHE
          python -m zipfile -l dist/*.whl | grep -q licenses/LICENSE-MIT
      - name: Tests pass from the unpacked sdist against the installed wheel
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl pytest jsonschema
          mkdir /tmp/sd && tar xzf dist/*.tar.gz -C /tmp/sd
          cd /tmp/sd/* && rm -rf dadl && /tmp/v/bin/python -m pytest -q
          /tmp/v/bin/dadl quickstart

  coverage:
    name: Calibration coverage gate (1,000 replicates)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2, pinned by commit SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-python v5.3.0, pinned by commit SHA
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e "./python[test]"
      - name: 95% intervals cover the injected truth in every regime (binomial 99.9% band, Bonferroni per calibration)
        env:
          # One BLAS thread per worker (see dadl.calibration.coverage.run).
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        timeout-minutes: 50
        run: python -m dadl.calibration.coverage all --replicates 1000 --jobs 4
