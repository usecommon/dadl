name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      # actions/checkout v4.2.2, pinned by commit SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Test
        run: cargo test --workspace --all-targets

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      # actions/checkout v4.2.2, pinned by commit SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v5.3.0, pinned by commit SHA
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e "./python[test]"
      - name: Test (guardrail regression cases and closed-form checks)
        run: python -m pytest python/tests -q
      - name: Quickstart smoke test
        run: dadl quickstart chsh-spad
