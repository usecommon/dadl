[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dadl-quantum"
dynamic = ["version"]
description = "Detector-Aware Data Layer for quantum optics experiments"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "scipy>=1.10",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/usecommon/dadl"
Documentation = "https://usecommon.github.io/dadl/"
Changelog = "https://github.com/usecommon/dadl/blob/main/CHANGELOG.md"
Issues = "https://github.com/usecommon/dadl/issues"

[project.optional-dependencies]
test = ["pytest>=7.0", "jsonschema>=4.18"]

[project.scripts]
dadl = "dadl.cli:main"

[tool.hatch.version]
path = "dadl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["dadl"]

[tool.hatch.build.targets.sdist]
include = ["dadl", "tests", "README.md", "pyproject.toml", "LICENSE-MIT", "LICENSE-APACHE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: statistical calibration checks (seconds, run in CI)",
    "coverage: 1,000-replicate interval coverage gates (minutes; run with -m coverage)",
]
addopts = "-m 'not coverage'"
