# CHSH with a polarization-entangled SPDC source and four Si SPAD modules.
#
# This file drives the example: `dadl quickstart chsh-spad` loads it, and
# `dadl quickstart setup.yaml` runs your edited copy (make one with `dadl init`).
# Phase 1 runs on the simulator (backend: sim). To analyse your own tags, keep
# the analysis section and run `dadl analyze setup.yaml --tags tags.npz`.
#
# Units are in the key names: _ps picoseconds, _cps counts per second.
# Write large numbers as plain integers (100000) or with a signed exponent
# (1.0e+5): YAML 1.1 reads 1.0e5 as a string, and DADL refuses it.
schema_version: 1
name: chsh-spad

backend: sim
seed: 2026

source:
  type: spdc-cw
  pair_rate_per_s: 100000
  visibility: 0.95

# Ground truth for the simulator. On hardware these become calibration targets.
detectors:
  A+: &spad
    family: si-spad-module
    efficiency: 0.5
    dark_rate_cps: 500
    dead_time_ps: 22000
    jitter_sigma_ps: 350   # Gaussian sigma (a datasheet FWHM is 2.355 sigma)
    afterpulse_prob: 0.005
    afterpulse_tau_ps: 50000
    delay_ps: 0
  A-: *spad
  B+: *spad
  B-: *spad

# Channel numbers in a tag file -> channel names.
channels: {0: A+, 1: A-, 2: B+, 3: B-}

analysis:
  type: chsh
  settings_deg: {a: 0.0, "a'": 45.0, b: 22.5, "b'": 67.5}
  duration_s_per_setting: 1.0
  # Declared before acquisition. Windows chosen from the data are refused.
  # DADL records this source but cannot verify it until signed plans (phase 3).
  window:
    width_ps: 2000
    source: plan
    delays_ps: {}

policy: default
